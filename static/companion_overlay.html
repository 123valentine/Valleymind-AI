<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ValleyMind Companion</title>
<link rel="stylesheet" href="/static/companion_overlay.css" />
<!--
  Same-origin shims so the site's ONE voice module (cloud_voice.js) runs
  byte-for-byte unchanged: it expects apiFetch()/authHeaders() to exist. The
  overlay WebView talks only to the ValleyMind origin, so cookies carry the
  session and no token store is needed.
-->
<script>
  window.API_BASE_URL = "";
  window.apiUrl = function (p) { return p; };
  window.authHeaders = function (extra) { return Object.assign({}, extra || {}); };
  window.apiFetch = function (path, options) {
    options = options || {};
    var controller = new AbortController();
    var timeout = window.setTimeout(function () { controller.abort(); }, options.timeoutMs || 60000);
    return fetch(path, Object.assign({ credentials: "include", signal: controller.signal }, options))
      .finally(function () { window.clearTimeout(timeout); });
  };
</script>
<!-- The site's single voice system (STT/TTS/amplitude), reused not reimplemented. -->
<script src="/static/cloud_voice.js"></script>
<!-- The tap-to-talk turn state machine (pure logic, no DOM). -->
<script src="/static/companion_turn_sm.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vrm-preview/assets/node_modules/three/build/three.module.js",
    "three/": "/vrm-preview/assets/node_modules/three/",
    "three/addons/": "/vrm-preview/assets/node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "/vrm-preview/assets/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "@pixiv/three-vrm-core": "/vrm-preview/assets/node_modules/@pixiv/three-vrm-core/lib/three-vrm-core.module.js",
    "@pixiv/three-vrm-animation": "/vrm-preview/assets/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>
  <!--
    The floating surface. The character IS the UI: no panel, no card, no
    status pill. The only visible chrome is a small mic attached to the
    character's body (tap to talk) and a tiny icon-only × to put it away.
    Both are positioned by the page from the model's world position, so the
    character composes over other apps with a fully transparent background.
  -->
  <div id="vmOverlayRoot">
    <canvas id="stage"></canvas>

    <button id="btnMic" class="mic" type="button" aria-label="Talk to your companion" title="Tap to talk">&#127908;</button>
    <button id="btnHide" class="hide" type="button" aria-label="Put the companion away" title="Put away">&#10005;</button>
  </div>

  <script type="module" src="/static/companion_overlay.js"></script>
</body>
</html>
