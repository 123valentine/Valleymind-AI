<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ValleyMind Companion</title>
<link rel="stylesheet" href="/static/companion_overlay.css" />
<!--
  Same-origin shims so the site's ONE voice module (cloud_voice.js) runs
  byte-for-byte unchanged: it expects apiFetch()/authHeaders() to exist. The
  overlay WebView talks only to the ValleyMind origin, so cookies carry the
  session and no token store is needed.
-->
<script>
  window.API_BASE_URL = "";
  window.apiUrl = function (p) { return p; };
  window.authHeaders = function (extra) { return Object.assign({}, extra || {}); };
  window.apiFetch = function (path, options) {
    options = options || {};
    var controller = new AbortController();
    var timeout = window.setTimeout(function () { controller.abort(); }, options.timeoutMs || 60000);
    return fetch(path, Object.assign({ credentials: "include", signal: controller.signal }, options))
      .finally(function () { window.clearTimeout(timeout); });
  };
</script>
<!-- The site's single voice system (STT/TTS/amplitude), reused not reimplemented. -->
<script src="/static/cloud_voice.js"></script>
<!-- The tap-to-talk turn state machine (pure logic, no DOM). -->
<script src="/static/companion_turn_sm.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vrm-preview/assets/node_modules/three/build/three.module.js",
    "three/": "/vrm-preview/assets/node_modules/three/",
    "three/addons/": "/vrm-preview/assets/node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "/vrm-preview/assets/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "@pixiv/three-vrm-core": "/vrm-preview/assets/node_modules/@pixiv/three-vrm-core/lib/three-vrm-core.module.js",
    "@pixiv/three-vrm-animation": "/vrm-preview/assets/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>
  <!--
    The floating surface. The character is the UI: no panel, no card, no status
    pill and no ring behind her legs. A compact dark-glass micro-pill sits
    directly beneath her feet with three icon controls: Talk / Mute Mic (with a
    centred glow while listening or speaking), Camera Eyes toggle, and Close.

    The character stage + pill are the whole interactive region; transparent
    space outside them passes touches straight through. The stage is also the
    drag surface: a tap wakes the companion, a drag moves it.
  -->
  <div id="vmOverlayRoot" data-state="idle">
    <canvas id="stage"></canvas>

    <div id="vmMicroPill" class="micro-pill" role="group" aria-label="Companion controls">
      <button id="btnTalk" class="ctl-btn" type="button" aria-label="Talk to ValleyMind" aria-pressed="false" title="Talk / Mute Mic">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" />
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" />
        </svg>
        <svg class="icon icon-slash" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4L20 20" />
        </svg>
        <span class="vm-glow" aria-hidden="true"></span>
      </button>
      <button id="btnCamera" class="ctl-btn" type="button" aria-label="Turn camera eyes on" aria-pressed="false" title="Camera Eyes">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6.5" width="13" height="11" rx="2.5" />
          <path d="M16 10.5l5-3v9l-5-3z" />
        </svg>
      </button>
      <button id="btnHide" class="ctl-btn" type="button" aria-label="Put the companion away" title="Put away">&#10005;</button>
    </div>

    <!-- Kept hidden for the legacy Android page verifier; the visible end/mute
         control is now the Talk/Mute Mic icon in the pill above. -->
    <div id="vmHalo" class="halo" hidden aria-hidden="true"></div>
    <button id="btnStop" class="stop" type="button" hidden aria-label="End the conversation">&#9632;</button>
  </div>

  <!-- Versioned native facade (additive): capability checks for overlay region,
       native ASR and screen-context capture. -->
  <script src="/static/native_bridge.js"></script>
  <script type="module" src="/static/companion_overlay.js"></script>
</body>
</html>
