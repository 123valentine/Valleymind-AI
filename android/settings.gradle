// ValleyMind Android companion — Gradle settings.
//
// This project is a THIN native shell around the existing ValleyMind web app
// (same backend, auth, companion engine and voice) plus the Android-native
// system overlay that a browser/PWA cannot provide.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ValleyMindCompanion"
include(":app")
